name: CI

# 每次 push 或 PR 到 main 時自動跑
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # 把 secret 拉到 job-level env，這樣 step 的 if: 才能用 env.X 來判斷
    # （secrets context 在 step-level if: 裡會被遮罩處理，比較不到，所以
    # 必須先繞道 env）
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Lv1：語法檢查
      # node --check 只做語法解析，不執行程式，所以不需要 API key
      - name: Syntax check
        run: |
          node --check post.js
          node --check generate-topics.js
          node --check lib.js

      # Lv2（附帶）：用 npm ci 而不是 npm install
      # npm ci 嚴格照 package-lock.json 安裝，確保版本一致
      - name: Install dependencies
        run: npm ci

      # Lv3：單元測試
      # node --test 會自動尋找所有 *.test.js 執行
      - name: Unit tests
        run: node --test

      # Lv4：dry-run 生成驗證
      # 實際呼叫 Gemini API，確認 prompt / 回傳格式沒問題，但不發到 Discord
      # 需要在 GitHub repo Settings → Secrets 裡設定 GEMINI_API_KEY
      # 沒設定的話這步會跳過（不會讓整個 CI 失敗）
      - name: Dry-run generation
        if: env.GEMINI_API_KEY != ''
        run: node post.js
        env:
          DISCORD_CHANNEL_ID: dry-run
          DRY_RUN: "true"
